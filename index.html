<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call Stand-In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            overflow: hidden;
            cursor: none;
        }

        body.show-cursor {
            cursor: default;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
        }

        #profileContainer {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: auto;
            cursor: grab;
            transition: none;
        }

        #profileContainer.dragging {
            cursor: grabbing;
        }

        #profileContainer.no-transition {
            transition: none;
        }

        #profileImage {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            display: none;
        }

        #profileImage.loaded {
            display: block;
        }

        #profilePlaceholder {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }

        #profilePlaceholder.hidden {
            display: none;
        }

        #controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(26, 26, 46, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 100;
            min-width: 280px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #controls.visible {
            opacity: 1;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="file"] {
            display: none;
        }

        .file-upload-btn {
            width: 100%;
            padding: 10px 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-align: center;
        }

        .file-upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            border: none;
        }

        input[type="color"] {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
        }

        select {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            outline: none;
        }

        select option {
            background: #1a1a2e;
        }

        button {
            width: 100%;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            margin-top: 5px;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        button.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
        }

        .value-display {
            display: inline-block;
            float: right;
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
        }

        #status {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 26, 46, 0.95);
            padding: 12px 24px;
            border-radius: 25px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #status.visible {
            opacity: 1;
        }

        .hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            text-align: center;
            z-index: 5;
            opacity: 0;
            animation: fadeInOut 3s ease-in-out;
            pointer-events: none;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        .remove-image-btn {
            background: rgba(220, 38, 38, 0.8);
            margin-top: 10px;
        }

        .remove-image-btn:hover {
            background: rgba(220, 38, 38, 1);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="profileContainer">
        <img id="profileImage" alt="Profile">
        <div id="profilePlaceholder">Upload a photo to get started</div>
    </div>

    <div id="controls">
        <div class="control-group">
            <label>Profile Picture</label>
            <input type="file" id="imageUpload" accept="image/*">
            <label for="imageUpload" class="file-upload-btn">Upload Photo</label>
            <button id="removeImage" class="remove-image-btn" style="display: none;">Remove Photo</button>
        </div>

        <div class="control-group">
            <label>
                Image Size
                <span class="value-display" id="imageSizeValue">200px</span>
            </label>
            <input type="range" id="imageSize" min="50" max="500" value="200">
        </div>

        <div class="control-group">
            <label>
                Horizontal Position
                <span class="value-display" id="imageXValue">0</span>
            </label>
            <input type="range" id="imageX" min="-800" max="800" value="0">
        </div>

        <div class="control-group">
            <label>
                Vertical Position
                <span class="value-display" id="imageYValue">0</span>
            </label>
            <input type="range" id="imageY" min="-500" max="500" value="0">
        </div>

        <div class="control-group">
            <button id="resetPosition">Reset Position & Size</button>
        </div>

        <div class="control-group">
            <label>Visualization Style</label>
            <select id="visualizationStyle">
                <option value="circular">Circular Bars</option>
                <option value="waveform">Waveform</option>
                <option value="particles">Particles</option>
                <option value="rings">Pulsing Rings</option>
            </select>
        </div>

        <div class="control-group">
            <label>
                Sensitivity
                <span class="value-display" id="sensitivityValue">100%</span>
            </label>
            <input type="range" id="sensitivity" min="10" max="200" value="100">
        </div>

        <div class="control-group">
            <label>
                Smoothing
                <span class="value-display" id="smoothingValue">80%</span>
            </label>
            <input type="range" id="smoothing" min="0" max="100" value="80">
        </div>

        <div class="control-group">
            <label>Visualization Color</label>
            <input type="color" id="colorPicker" value="#667eea">
        </div>

        <div class="control-group">
            <button id="micToggle" class="active">Microphone: ON</button>
        </div>
    </div>

    <div id="status">Press any key or move mouse to show controls</div>

    <script>
        // Configuration
        const config = {
            sensitivity: 1.0,
            smoothing: 0.8,
            color: '#667eea',
            visualizationStyle: 'circular',
            micEnabled: true,
            imageSize: 200,
            imageX: 0,
            imageY: 0
        };

        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height, centerX, centerY;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Audio setup
        let audioContext;
        let analyser;
        let microphone;
        let dataArray;
        let bufferLength;
        let animationId;

        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);

                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = config.smoothing;
                bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);

                microphone.connect(analyser);

                showStatus('Microphone connected!', 2000);
                animate();
            } catch (error) {
                console.error('Error accessing microphone:', error);
                showStatus('Microphone access denied. Please allow microphone access.', 5000);
            }
        }

        // Image handling
        const imageUpload = document.getElementById('imageUpload');
        const profileImage = document.getElementById('profileImage');
        const profilePlaceholder = document.getElementById('profilePlaceholder');
        const removeImageBtn = document.getElementById('removeImage');

        // Load saved image from localStorage
        function loadSavedImage() {
            const savedImage = localStorage.getItem('profileImage');
            if (savedImage) {
                profileImage.src = savedImage;
                profileImage.classList.add('loaded');
                profilePlaceholder.classList.add('hidden');
                removeImageBtn.style.display = 'block';
            }
        }

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        // Create a canvas to crop the image to a square
                        const cropCanvas = document.createElement('canvas');
                        const cropCtx = cropCanvas.getContext('2d');
                        const size = Math.min(img.width, img.height);
                        cropCanvas.width = size;
                        cropCanvas.height = size;

                        const sx = (img.width - size) / 2;
                        const sy = (img.height - size) / 2;
                        cropCtx.drawImage(img, sx, sy, size, size, 0, 0, size, size);

                        const croppedImage = cropCanvas.toDataURL('image/jpeg', 0.8);
                        profileImage.src = croppedImage;
                        profileImage.classList.add('loaded');
                        profilePlaceholder.classList.add('hidden');
                        removeImageBtn.style.display = 'block';

                        // Save to localStorage
                        localStorage.setItem('profileImage', croppedImage);
                        showStatus('Photo uploaded successfully!', 2000);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        removeImageBtn.addEventListener('click', () => {
            profileImage.src = '';
            profileImage.classList.remove('loaded');
            profilePlaceholder.classList.remove('hidden');
            removeImageBtn.style.display = 'none';
            localStorage.removeItem('profileImage');
            imageUpload.value = '';
            showStatus('Photo removed', 2000);
        });

        // Profile container positioning and sizing
        const profileContainer = document.getElementById('profileContainer');

        function updateProfileTransform() {
            // Update size
            profileImage.style.width = config.imageSize + 'px';
            profileImage.style.height = config.imageSize + 'px';
            profilePlaceholder.style.width = config.imageSize + 'px';
            profilePlaceholder.style.height = config.imageSize + 'px';

            // Update position
            profileContainer.style.transform = `translate(calc(-50% + ${config.imageX}px), calc(-50% + ${config.imageY}px))`;

            // Save to localStorage
            localStorage.setItem('imageSize', config.imageSize);
            localStorage.setItem('imageX', config.imageX);
            localStorage.setItem('imageY', config.imageY);
        }

        function loadImageSettings() {
            const savedSize = localStorage.getItem('imageSize');
            const savedX = localStorage.getItem('imageX');
            const savedY = localStorage.getItem('imageY');

            if (savedSize) {
                config.imageSize = parseInt(savedSize);
                document.getElementById('imageSize').value = config.imageSize;
                document.getElementById('imageSizeValue').textContent = config.imageSize + 'px';
            }
            if (savedX) {
                config.imageX = parseInt(savedX);
                document.getElementById('imageX').value = config.imageX;
                document.getElementById('imageXValue').textContent = config.imageX;
            }
            if (savedY) {
                config.imageY = parseInt(savedY);
                document.getElementById('imageY').value = config.imageY;
                document.getElementById('imageYValue').textContent = config.imageY;
            }

            updateProfileTransform();
        }

        // Drag functionality
        let isDragging = false;
        let dragStartX, dragStartY;
        let initialX, initialY;

        profileContainer.addEventListener('mousedown', (e) => {
            // Don't interfere with controls
            if (e.target.closest('#controls')) return;

            isDragging = true;
            profileContainer.classList.add('dragging');
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            initialX = config.imageX;
            initialY = config.imageY;
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const deltaX = e.clientX - dragStartX;
            const deltaY = e.clientY - dragStartY;

            config.imageX = initialX + deltaX;
            config.imageY = initialY + deltaY;

            document.getElementById('imageX').value = config.imageX;
            document.getElementById('imageY').value = config.imageY;
            document.getElementById('imageXValue').textContent = config.imageX;
            document.getElementById('imageYValue').textContent = config.imageY;

            updateProfileTransform();
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                profileContainer.classList.remove('dragging');
            }
        });

        // Visualization functions
        function drawCircularBars() {
            analyser.getByteFrequencyData(dataArray);

            ctx.clearRect(0, 0, width, height);

            const bars = 100;
            const radius = 140;
            const maxBarHeight = 150;

            for (let i = 0; i < bars; i++) {
                const dataIndex = Math.floor((i / bars) * bufferLength);
                const value = dataArray[dataIndex] * config.sensitivity;
                const barHeight = (value / 255) * maxBarHeight;

                const angle = (i / bars) * Math.PI * 2;
                const x1 = centerX + Math.cos(angle) * radius;
                const y1 = centerY + Math.sin(angle) * radius;
                const x2 = centerX + Math.cos(angle) * (radius + barHeight);
                const y2 = centerY + Math.sin(angle) * (radius + barHeight);

                const alpha = 0.3 + (barHeight / maxBarHeight) * 0.7;
                ctx.strokeStyle = hexToRgba(config.color, alpha);
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }
        }

        function drawWaveform() {
            analyser.getByteTimeDomainData(dataArray);

            ctx.clearRect(0, 0, width, height);

            const sliceWidth = width / bufferLength;
            const amplitude = 200 * config.sensitivity;

            ctx.strokeStyle = config.color;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.beginPath();

            for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0;
                const y = (v * amplitude) + centerY;
                const x = i * sliceWidth;

                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }

            ctx.stroke();
        }

        let particles = [];
        function drawParticles() {
            analyser.getByteFrequencyData(dataArray);

            ctx.fillStyle = 'rgba(10, 10, 10, 0.1)';
            ctx.fillRect(0, 0, width, height);

            // Generate new particles based on audio
            const avgVolume = dataArray.reduce((a, b) => a + b, 0) / bufferLength;
            if (avgVolume > 50 && particles.length < 200) {
                for (let i = 0; i < 3; i++) {
                    particles.push({
                        x: centerX,
                        y: centerY,
                        vx: (Math.random() - 0.5) * 5,
                        vy: (Math.random() - 0.5) * 5,
                        size: Math.random() * 3 + 1,
                        life: 1.0
                    });
                }
            }

            // Update and draw particles
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.01;

                const alpha = p.life * 0.8;
                ctx.fillStyle = hexToRgba(config.color, alpha);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                return p.life > 0;
            });
        }

        function drawRings() {
            analyser.getByteFrequencyData(dataArray);

            ctx.clearRect(0, 0, width, height);

            const avgVolume = dataArray.reduce((a, b) => a + b, 0) / bufferLength;
            const scale = 1 + (avgVolume / 255) * config.sensitivity * 0.5;

            for (let i = 0; i < 5; i++) {
                const radius = 100 + i * 40;
                const scaledRadius = radius * scale;
                const alpha = 0.6 - i * 0.1;

                ctx.strokeStyle = hexToRgba(config.color, alpha);
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(centerX, centerY, scaledRadius, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function animate() {
            if (!config.micEnabled) {
                ctx.clearRect(0, 0, width, height);
                return;
            }

            switch (config.visualizationStyle) {
                case 'circular':
                    drawCircularBars();
                    break;
                case 'waveform':
                    drawWaveform();
                    break;
                case 'particles':
                    drawParticles();
                    break;
                case 'rings':
                    drawRings();
                    break;
            }

            animationId = requestAnimationFrame(animate);
        }

        // Controls
        const controls = document.getElementById('controls');
        const status = document.getElementById('status');
        let hideTimeout;
        let isControlsVisible = false;

        function showControls() {
            controls.classList.add('visible');
            status.classList.add('visible');
            document.body.classList.add('show-cursor');
            isControlsVisible = true;

            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
                controls.classList.remove('visible');
                status.classList.remove('visible');
                document.body.classList.remove('show-cursor');
                isControlsVisible = false;
            }, 1000);
        }

        function showStatus(message, duration = 2000) {
            status.textContent = message;
            status.classList.add('visible');
            setTimeout(() => {
                if (!isControlsVisible) {
                    status.classList.remove('visible');
                }
            }, duration);
        }

        document.addEventListener('mousemove', showControls);
        document.addEventListener('keydown', showControls);

        // Control inputs
        document.getElementById('sensitivity').addEventListener('input', (e) => {
            config.sensitivity = e.target.value / 100;
            document.getElementById('sensitivityValue').textContent = e.target.value + '%';
        });

        document.getElementById('smoothing').addEventListener('input', (e) => {
            const value = e.target.value / 100;
            config.smoothing = value;
            if (analyser) {
                analyser.smoothingTimeConstant = value;
            }
            document.getElementById('smoothingValue').textContent = e.target.value + '%';
        });

        document.getElementById('colorPicker').addEventListener('input', (e) => {
            config.color = e.target.value;
        });

        document.getElementById('visualizationStyle').addEventListener('change', (e) => {
            config.visualizationStyle = e.target.value;
            particles = []; // Reset particles when changing style
        });

        // Image controls
        document.getElementById('imageSize').addEventListener('input', (e) => {
            config.imageSize = parseInt(e.target.value);
            document.getElementById('imageSizeValue').textContent = config.imageSize + 'px';
            updateProfileTransform();
        });

        document.getElementById('imageX').addEventListener('input', (e) => {
            config.imageX = parseInt(e.target.value);
            document.getElementById('imageXValue').textContent = config.imageX;
            updateProfileTransform();
        });

        document.getElementById('imageY').addEventListener('input', (e) => {
            config.imageY = parseInt(e.target.value);
            document.getElementById('imageYValue').textContent = config.imageY;
            updateProfileTransform();
        });

        document.getElementById('resetPosition').addEventListener('click', () => {
            config.imageSize = 200;
            config.imageX = 0;
            config.imageY = 0;

            document.getElementById('imageSize').value = 200;
            document.getElementById('imageX').value = 0;
            document.getElementById('imageY').value = 0;

            document.getElementById('imageSizeValue').textContent = '200px';
            document.getElementById('imageXValue').textContent = '0';
            document.getElementById('imageYValue').textContent = '0';

            updateProfileTransform();
            showStatus('Position and size reset', 2000);
        });

        const micToggle = document.getElementById('micToggle');
        micToggle.addEventListener('click', () => {
            config.micEnabled = !config.micEnabled;
            micToggle.textContent = config.micEnabled ? 'Microphone: ON' : 'Microphone: OFF';
            micToggle.classList.toggle('active');

            if (config.micEnabled && audioContext) {
                animate();
            } else {
                cancelAnimationFrame(animationId);
                ctx.clearRect(0, 0, width, height);
            }
        });

        // Utility function
        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // Initialize
        loadSavedImage();
        loadImageSettings();
        showStatus('Press any key or move mouse to show controls', 3000);

        // Auto-start microphone after a short delay
        setTimeout(() => {
            initAudio();
        }, 500);
    </script>
</body>
</html>
